[project]
name = "videoqa"
version = "1.0.0"
description = "Local, low-cost long-video question answering: transcript retrieval, selective frame acquisition with a cheap visual scout, and a small frozen vision-language model, with a full per-stage cost trace."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Core deps are deliberately light so the CPU smoke test runs anywhere.
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "av>=12.0",           # PyAV: frame decoding with real presentation timestamps
    "pillow>=10.0",       # image handling for frames / crops / synthetic fixtures
    "psutil>=7.2.2",
]

[project.optional-dependencies]
# Heavy model stack: only needed for real scouts, controllers and answer VLMs.
models = [
    "torch>=2.7",
    "torchvision>=0.22",
    "transformers>=4.57",
    "accelerate>=1.0",
    "peft>=0.17",
    "open_clip_torch>=2.32",
]
dev = ["pytest>=8.0"]

[project.scripts]
videoqa = "videoqa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videoqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Windows wheels of torch on PyPI are CPU-only.  The dev GPU (RTX 5060 Ti,
# Blackwell sm_120) needs CUDA 12.8+ builds, so torch/torchvision come from the
# official PyTorch cu128 index.  'explicit' keeps every other package on PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
