# 6-8 GB discrete GPU. Load models sequentially; never keep scout + answerer
# resident together unless profiling shows it fits.
inherit: base.yaml
device: cuda
budget:
  max_frames: 4
  max_visual_tokens: 2048
scout:
  backend: open_clip
answerer:
  backend: hf_vlm
  model_id: Qwen/Qwen3-VL-2B-Instruct
  # Pinned Hub revision (verified 2026-09-26, Apache-2.0).
  revision: 89644892e4d85e24eaac8bacfd4f463576704203
  dtype: bfloat16
  frame_max_side: 448
